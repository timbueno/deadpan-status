# Public service monitoring for Deadpan apps.
owner: timbueno
repo: deadpan-status
user-agent: deadpan-status/1.0

# Public health endpoints require no service credentials.
# GH_PAT is provided separately by Upptime's generated workflows.
secrets: []
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

sites:
  - name: Leaf - KOSync
    slug: leaf-kosync
    url: https://kosync.deadpan.io/healthcheck
    headers:
      - "Accept: application/vnd.koreader.v1+json"
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '"state":"OK"'
  - name: Leaf - API
    slug: leaf-api
    url: https://api.deadpan.io/leaf/health
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: '"status":"ok"'

# Offset the five-minute checks from the start of the hour.
# GitHub scheduled workflows can be delayed; this is not a timing guarantee.
workflowSchedule:
  uptime: "2-57/5 * * * *"

status-website:
  cname: status.deadpan.io
  logoUrl: https://raw.githubusercontent.com/timbueno/deadpan-status/master/assets/deadpan-circle-type.svg
  name: Deadpan Status
  introTitle: "**Service status for Deadpan apps.**"
  introMessage: Current availability and recent incidents for our app services. Automated checks run approximately every five minutes.
  navbar:
    - title: Status
      href: /
    - title: Incidents
      href: https://github.com/timbueno/deadpan-status/issues
    - title: GitHub
      href: https://github.com/timbueno/deadpan-status
