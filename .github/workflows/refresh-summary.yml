# Custom workflow: kept separate from Upptime-generated workflow files.
name: Refresh Status Summary
on:
  workflow_run:
    workflows: ["Uptime CI", "Summary CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Serialize checkout/generation/push with every Upptime history writer.
  group: ${{ github.repository }}-master-upptime
  cancel-in-progress: false
jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
    steps:
      - name: Create GitHub App token
        id: app_token
        if: ${{ vars.GH_APP_ID != '' && env.GH_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
      - name: Clear GitHub App private key
        if: ${{ always() }}
        shell: bash
        run: echo "GH_APP_PRIVATE_KEY=" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          token: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      - name: Update summary in README
        uses: upptime/uptime-monitor@v1.44.0
        with:
          command: "readme"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}

      - name: Reconcile current status from checked-out history
        run: python3 scripts/reconcile-summary.py
      - name: Publish corrected current status when needed
        run: |
          git add history/summary.json README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "Upptime Bot"
          git config user.email "73812536+upptime-bot@users.noreply.github.com"
          git commit -m "Reconcile summary with monitor state [skip ci] [upptime]"
          git push origin HEAD:master
